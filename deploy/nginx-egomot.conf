# EGOMOT — nginx үлгүсү
#
#   sudo cp deploy/nginx-egomot.conf /etc/nginx/sites-available/egomot
#   sudo ln -s /etc/nginx/sites-available/egomot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS үчүн: sudo certbot --nginx -d egomot.example.kg

server {
    listen 80;
    server_name egomot.example.kg;

    # PWA курулган статикалык файлдар.
    root /opt/egomot/apps/web/dist;
    index index.html;

    # API'ге проксилөө. Тиркеме Online-only, ошондуктан кэш жок.
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Security Log чыныгы IP'ди жазышы үчүн (Express'те
        # `app.set('trust proxy', 1)` керек болушу мүмкүн).
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Service worker кэштелбеши керек, антпесе жаңы версия жетпейт.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA: белгисиз жолдор index.html'ге барат.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
